# fly.toml app configuration file generated for telegrambot-fq7xig on 2026-08-07T00:45:09Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'telegrambot-fq7xig'
primary_region = 'iad'

[build]
  builder = 'paketobuildpacks/builder:base'

[env]
  PORT = '8080'

[processes]
  app = 'python telegram_bot_raw.py'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
